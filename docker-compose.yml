# Deploy compose — runs on Lumra (192.168.4.38, dongle) at /data/datvi-docs.
# The @twobots/game-kit API reference, Ayula-fronted at BOTH:
#   https://docs.twobots.dev/datvi/       (public)
#   https://docs.bjornbasar.com/datvi/    (Cloudflare Access)
#
# Moved from Bosco 2026-10-23, alongside the other `*-docs` sites — Lumra now hosts every
# doc-leaning site in the estate (otso/cookbook/paddington/homelab/karhu/datvi/wojtek-docs),
# while Bosco takes the pure static/brochure sites instead. Port 8101 is globally reserved
# for datvi-docs — see fleet.toml for current per-service host placement.
services:
  datvi-docs:
    image: 192.168.4.9:5000/datvi-docs:latest
    container_name: datvi-docs
    ports:
      - "8101:80"
    restart: unless-stopped
